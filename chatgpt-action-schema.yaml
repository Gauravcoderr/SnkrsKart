openapi: 3.1.0
info:
  title: SNKRS CART Live Inventory API
  description: Fetches live sneaker products, brands, and blog posts from SNKRS CART (India, INR, UK sizes). For per-size prices, stock and cart links, AI agents should use the MCP server at https://www.snkrscart.com/mcp
  version: 1.0.0
servers:
  - url: https://api.snkrscart.com/api/v1

paths:
  /products:
    get:
      operationId: getProducts
      summary: Get all sneaker products with optional filters
      parameters:
        - name: search
          in: query
          description: Search by name or keyword
          schema:
            type: string
        - name: brand
          in: query
          description: Filter by brand (Nike, Jordan, Adidas, New Balance, Crocs)
          schema:
            type: string
        - name: gender
          in: query
          description: Filter by gender (men, women, kids, unisex)
          schema:
            type: string
        - name: limit
          in: query
          description: Number of products to return (default 20, max 48)
          schema:
            type: integer
            maximum: 48
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
        - name: size
          in: query
          description: UK sizes in stock, comma separated (e.g. 9 or 8.5,9)
          schema:
            type: string
        - name: minPrice
          in: query
          description: Minimum price in INR
          schema:
            type: number
        - name: maxPrice
          in: query
          description: Maximum price in INR
          schema:
            type: number
        - name: sort
          in: query
          description: newest, popular, price_asc or price_desc
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        brand:
                          type: string
                        price:
                          type: number
                        originalPrice:
                          type: number
                        discount:
                          type: number
                        colorway:
                          type: string
                        gender:
                          type: string
                        availableSizes:
                          type: array
                          items:
                            type: number
                        soldOut:
                          type: boolean
                          description: True if the product is completely out of stock
                        rating:
                          type: number
                          description: Average customer rating out of 5
                        reviewCount:
                          type: number
                          description: Total number of customer reviews
                        slug:
                          type: string
                          description: URL slug — append to https://www.snkrscart.com/products/ to get the product page
                        images:
                          type: array
                          items:
                            type: string
                          description: Product image URLs (Cloudinary CDN)
                        trending:
                          type: boolean
                          description: True if currently trending on SNKRS CART
                        newArrival:
                          type: boolean
                          description: True if recently added to the catalog
                        featured:
                          type: boolean
                          description: True if editorially featured on the homepage

  /products/{slug}:
    get:
      operationId: getProductBySlug
      summary: Get full details of a single product
      parameters:
        - name: slug
          in: path
          required: true
          description: Product slug (e.g. air-jordan-3-retro-black-cement-2024-mens)
          schema:
            type: string
      responses:
        "200":
          description: Full product details

  /products/featured:
    get:
      operationId: getFeaturedProducts
      summary: Get featured/highlighted products
      responses:
        "200":
          description: Featured products list

  /products/new-arrivals:
    get:
      operationId: getNewArrivals
      summary: Get latest new arrival sneakers
      responses:
        "200":
          description: New arrivals list

  /products/trending:
    get:
      operationId: getTrendingProducts
      summary: Get currently trending sneakers
      responses:
        "200":
          description: Trending products list

  /brands:
    get:
      operationId: getBrands
      summary: Get all available brands
      responses:
        "200":
          description: Brands list

  /blogs:
    get:
      operationId: getBlogs
      summary: Get all blog posts
      responses:
        "200":
          description: Blog posts list

  /faqs:
    get:
      operationId: getFaqs
      summary: Get frequently asked questions about SNKRS CART
      description: The answers shown on snkrscart.com/faqs (ordering, payment, shipping, returns, sizing, authenticity, contact)
      responses:
        "200":
          description: FAQ list
          content:
            application/json:
              schema:
                type: object
                properties:
                  faqs:
                    type: array
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                          description: Customer question
                        answer:
                          type: string
                          description: Answer from SNKRS CART, plain text
